spring:
  application:
    name: EventHub
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:eventhub-super-secret-jwt-key-2026-campus-event-management-secure-key-32bytes!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  admin:
    seed:
      enabled: ${ADMIN_SEED_ENABLED:true}
      email: ${ADMIN_EMAIL:admin@eventhub.com}
      password: ${ADMIN_PASSWORD:Admin@1234}
      name: ${ADMIN_NAME:EventHub Administrator}
