spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/eventhub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.eventhub: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
